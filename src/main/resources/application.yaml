spring:
  application:
    name: Imprime Ai

logging:
  pattern:
    console: '%clr(%d{${LOG_DATEFORMAT_PATTERN:yyyy-MM-dd HH:mm:ss.SSS}}){faint} %clr(${LOG_LEVEL_PATTERN:%5p}) %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} userId[%X{user-id}] transactionId[%X{transaction-id}] %m%n${LOG_EXCEPTION_CONVERSION_WORD:%wEx}'

imprime:
  ai:
    api:
      default-language: en_us
      crypto:
        secret: ${CRYPTO_SECRET:imprime-ai-dev-crypto-key}

oci:
  object-storage:
    namespace: ${OCI_OBJECT_STORAGE_NAMESPACE:gr2kz0u4gzog}
    config-file: ${OCI_CONFIG_FILE:./secret/oci.cfg}
    profile: ${OCI_CONFIG_PROFILE:DEFAULT}
    region-id: ${OCI_REGION_ID:sa-saopaulo-1}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

stripe:
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  currency: ${STRIPE_CURRENCY:brl}
  success-url: ${STRIPE_SUCCESS_URL:http://localhost:5173/cart?payment=success&session_id={CHECKOUT_SESSION_ID}}
  cancel-url: ${STRIPE_CANCEL_URL:http://localhost:5173/cart?payment=cancel}

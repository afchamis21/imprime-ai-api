spring:
  application:
    name: Imprime Ai
  thymeleaf:
    enabled: false
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:50MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:60MB}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 5s
    listener:
      simple:
        default-requeue-rejected: false
        acknowledge-mode: auto
        prefetch: 10
        retry:
          enabled: true
          stateless: true
          max-retries: 2
          initial-interval: 2s
          multiplier: 2.0
          max-interval: 30s

server:
  forward-headers-strategy: framework

cors:
  path-pattern: /**
  max-age: 3600
  allowed-methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
    - HEAD
  exposed-headers:
    - X-Transaction-Id
    - Content-Disposition
  allowed-origins:
    - https://imprimeai.shop
    - https://www.imprimeai.shop
    - https://api.imprimeai.shop
    - https://admin.imprimeai.shop
    - ${CORS_ORIGINS:}

websocket:
  allowed-origins:
    - https://imprimeai.shop
    - https://www.imprimeai.shop
    - https://api.imprimeai.shop
    - https://admin.imprimeai.shop
    - ${WS_ALLOWED_ORIGINS:${CORS_ORIGINS:}}

logging:
  pattern:
    console: '%clr(%d{${LOG_DATEFORMAT_PATTERN:yyyy-MM-dd HH:mm:ss.SSS}}){faint} %clr(${LOG_LEVEL_PATTERN:%5p}) %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} userId[%X{user-id}] transactionId[%X{transaction-id}] %m%n${LOG_EXCEPTION_CONVERSION_WORD:%wEx}'

imprime:
  ai:
    api:
      default-language: en_us
      crypto:
        secret: ${CRYPTO_SECRET:imprime-ai-dev-crypto-key}
      presence:
        ttl: ${MAKER_PRESENCE_TTL:4m}
        max-size: ${MAKER_PRESENCE_MAX_SIZE:10000}
    slicing:
      enabled: ${SLICING_VALIDATION_ENABLED:true}
      execution-mode: ${SLICING_EXECUTION_MODE:HYBRID}
      provider: ${SLICING_CLI_PROVIDER:BAMBU_STUDIO}
      binary-path: ${SLICING_CLI_BINARY:bambu-studio}
      docker-image: ${SLICING_DOCKER_IMAGE:imprimeai/slicer-cli:latest}
      profiles-dir: ${SLICING_PROFILES_DIR:}
      max-concurrent-jobs: ${SLICING_MAX_CONCURRENT_JOBS:2}
      per-plate-timeout-seconds: ${SLICING_PER_PLATE_TIMEOUT_SECONDS:30}
      sync-max-plates: ${SLICING_SYNC_MAX_PLATES:2}
      sync-max-bytes: ${SLICING_SYNC_MAX_BYTES:15728640}
      max-triangles-per-plate: ${SLICING_MAX_TRIANGLES_PER_PLATE:1500000}
      store-validated-artifacts: ${SLICING_STORE_VALIDATED_ARTIFACTS:true}
      validation:
        weight-tolerance-percent: ${SLICING_WEIGHT_TOLERANCE_PERCENT:5.0}
        min-weight-tolerance-grams: ${SLICING_MIN_WEIGHT_TOLERANCE_GRAMS:2.0}
        time-tolerance-percent: ${SLICING_TIME_TOLERANCE_PERCENT:10.0}
        min-time-tolerance-seconds: ${SLICING_MIN_TIME_TOLERANCE_SECONDS:120}
        hard-reject-tolerance-percent: ${SLICING_HARD_REJECT_TOLERANCE_PERCENT:30.0}
        divergence-policy: ${SLICING_DIVERGENCE_POLICY:RECALCULATE}
        fail-open-on-unavailable: ${SLICING_FAIL_OPEN_ON_UNAVAILABLE:false}
      rabbitmq:
        exchange: ${SLICING_RABBITMQ_EXCHANGE:imprimeai.slicing.exchange}
        queue: ${SLICING_RABBITMQ_QUEUE:imprimeai.slicing.queue}
        routing-key: ${SLICING_RABBITMQ_ROUTING_KEY:slicing.validate}
        dlx: ${SLICING_RABBITMQ_DLX:imprimeai.slicing.dlx}
        dlq: ${SLICING_RABBITMQ_DLQ:imprimeai.slicing.dlq}
        dlq-routing-key: ${SLICING_RABBITMQ_DLQ_ROUTING_KEY:slicing.dlq}
    notification:
      enabled: ${NOTIFICATIONS_EMAIL_ENABLED:true}
      public-base-url: ${APP_PUBLIC_BASE_URL:https://imprimeai.shop}
      mail:
        from-address: ${MAIL_FROM_ADDRESS:nao-responda@imprimeai.shop}
        from-name: ${MAIL_FROM_NAME:Imprime AÍ}
        reply-to: ${MAIL_REPLY_TO:suporte@imprimeai.shop}
        resend-api-key: ${RESEND_API_KEY:}
      rabbitmq:
        exchange: ${EMAIL_RABBITMQ_EXCHANGE:imprimeai.email.exchange}
        queue: ${EMAIL_RABBITMQ_QUEUE:imprimeai.email.queue}
        routing-key: ${EMAIL_RABBITMQ_ROUTING_KEY:imprimeai.email.send}
        dlx: ${EMAIL_RABBITMQ_DLX:imprimeai.email.dlx}
        dlq: ${EMAIL_RABBITMQ_DLQ:imprimeai.email.dlq}
        dlq-routing-key: ${EMAIL_RABBITMQ_DLQ_ROUTING_KEY:imprimeai.email.dlq}
      chat:
        debounce-window: ${CHAT_EMAIL_DEBOUNCE_WINDOW:5m}
        offer-debounce-window: ${CHAT_EMAIL_OFFER_DEBOUNCE_WINDOW:2m}
        cooldown-window: ${CHAT_EMAIL_COOLDOWN_WINDOW:15m}
        active-view-ttl: ${CHAT_ACTIVE_VIEW_TTL:90s}
        max-active-deferral: ${CHAT_MAX_ACTIVE_DEFERRAL:15m}
        poll-interval: ${CHAT_EMAIL_POLL_INTERVAL:30000}
        batch-size: ${CHAT_EMAIL_BATCH_SIZE:50}
      security:
        password-reset-ttl: ${PASSWORD_RESET_TOKEN_TTL:30m}
        email-verification-ttl: ${EMAIL_VERIFICATION_TOKEN_TTL:24h}

oci:
  object-storage:
    namespace: ${OCI_OBJECT_STORAGE_NAMESPACE:gr2kz0u4gzog}
    order-models-bucket: ${OCI_ORDER_MODELS_BUCKET:models}
    config-file: ${OCI_CONFIG_FILE:./secret/oci.cfg}
    profile: ${OCI_CONFIG_PROFILE:DEFAULT}
    region-id: ${OCI_REGION_ID:sa-saopaulo-1}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

stripe:
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  allow-simulated-order-checkout: ${STRIPE_ALLOW_SIMULATED_ORDER_CHECKOUT:false}
  currency: ${STRIPE_CURRENCY:brl}
  success-url: ${STRIPE_SUCCESS_URL:https://imprimeai.shop/cart?payment=success&session_id={CHECKOUT_SESSION_ID}}
  cancel-url: ${STRIPE_CANCEL_URL:https://imprimeai.shop/cart?payment=cancel}

melhor-envio:
  base-url: ${MELHOR_ENVIO_BASE_URL:https://sandbox.melhorenvio.com.br}
  access-token: ${MELHOR_ENVIO_ACCESS_TOKEN:}
  refresh-token: ${MELHOR_ENVIO_REFRESH_TOKEN:}
  client-id: ${MELHOR_ENVIO_CLIENT_ID:}
  client-secret: ${MELHOR_ENVIO_CLIENT_SECRET:}
  redirect-uri: ${MELHOR_ENVIO_REDIRECT_URI:}
  user-agent: ${MELHOR_ENVIO_USER_AGENT:}

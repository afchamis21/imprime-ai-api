spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
      connection-timeout: 20000
      initialization-fail-timeout: 10000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    clean-disabled: false

auth:
  access-token:
    key: ${JWT_ACCESS_KEY}
    duration: 5m
    token-type: access
  refresh-token:
    key: ${JWT_REFRESH_KEY}
    duration: 2h
    token-type: refresh

cors:
  allowed-origins:
    - https://imprimeai.shop
    - https://www.imprimeai.shop
    - https://api.imprimeai.shop
    - http://localhost:5173
    - http://127.0.0.1:5173
    - http://localhost:4173
    - ${CORS_ORIGINS:}

websocket:
  allowed-origins:
    - https://imprimeai.shop
    - https://www.imprimeai.shop
    - https://api.imprimeai.shop
    - http://localhost:5173
    - http://127.0.0.1:5173
    - http://localhost:4173
    - ${WS_ALLOWED_ORIGINS:${CORS_ORIGINS:}}

imprime:
  ai:
    api:
      environment: dev
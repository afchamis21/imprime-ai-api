<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<body th:replace="~{layout/base :: layout(
    title=${subject},
    preheader=${preheader},
    badgeText='Senha atualizada',
    badgeTone='emerald',
    heading='Sua senha foi alterada com sucesso',
    ctaLabel='Recuperar conta se não foi você',
    ctaUrl=${ctaUrl},
    showPreferencesLink=false,
    content=~{::#email-content}
)}">
<div id="email-content">
  <p style="margin:0 0 14px 0;">
    Olá, <strong th:text="${firstName ?: 'Usuário'}">Usuário</strong>!
  </p>
  <p style="margin:0 0 14px 0;">
    Confirmamos que a senha da sua conta na <strong style="color:#09090b;">Imprime AÍ</strong> foi alterada
    <span th:if="${changedAtFormatted != null and !#strings.isEmpty(changedAtFormatted)}">
      em <strong th:text="${changedAtFormatted}">agora</strong>
    </span>.
  </p>
  <p style="margin:0;color:#52525b;">
    Por segurança, todas as sessões anteriores foram desconectadas. Caso não reconheça esta alteração, solicite uma nova redefinição imediatamente pelo link abaixo.
  </p>
</div>
</body>
</html>

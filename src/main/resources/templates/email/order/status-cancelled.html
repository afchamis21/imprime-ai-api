<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<body th:replace="~{layout/base :: layout(
    title=${subject},
    preheader=${preheader},
    badgeText='Pedido cancelado',
    badgeTone='red',
    heading=${heading},
    ctaLabel='Ver detalhes do pedido',
    ctaUrl=${ctaUrl},
    showPreferencesLink=false,
    content=~{::#email-content}
)}">
<div id="email-content">
  <p style="margin:0 0 14px 0;">
    Olá, <strong th:text="${recipientName ?: 'Usuário'}">Usuário</strong>!
  </p>
  <p style="margin:0 0 16px 0;">
    Informamos que o pedido <strong th:text="${orderCode}">#PED</strong> foi cancelado.
  </p>

  <div th:replace="~{fragments/info-box :: infoRows(${infoRows})}"></div>

  <p th:if="${cancellationReason != null and !#strings.isEmpty(cancellationReason)}"
     style="margin:16px 0 0 0;padding:12px 14px;background-color:#fafafa;border:1px solid #e4e4e7;border-radius:6px;font-size:13px;color:#3f3f46;">
    <strong style="color:#09090b;">Motivo registrado:</strong>
    <span th:text="${cancellationReason}">Motivo do cancelamento</span>
  </p>

  <p style="margin:16px 0 0 0;font-size:14px;color:#52525b;">
    <strong>Próximo passo:</strong> Caso tenha havido cobrança e o estorno ainda não tenha sido processado automaticamente, acesse os detalhes do pedido ou entre em contato com o nosso suporte.
  </p>
</div>
</body>
</html>

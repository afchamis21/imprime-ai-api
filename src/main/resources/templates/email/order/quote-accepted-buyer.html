<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<body th:replace="~{layout/base :: layout(
    title=${subject},
    preheader=${preheader},
    badgeText='Orçamento aprovado',
    badgeTone='violet',
    heading=${heading},
    ctaLabel='Pagar e iniciar produção',
    ctaUrl=${ctaUrl},
    showPreferencesLink=false,
    content=~{::#email-content}
)}">
<div id="email-content">
  <p style="margin:0 0 14px 0;">
    Olá, <strong th:text="${recipientName ?: 'Cliente'}">Cliente</strong>!
  </p>
  <p style="margin:0 0 16px 0;">
    O orçamento de <strong th:text="${offerFormatted}">R$ 0,00</strong> com o estúdio
    <strong th:text="${makerName ?: 'Maker'}">Maker</strong> foi aprovado para o pedido
    <strong th:text="${orderCode}">#PED</strong>.
  </p>

  <div th:replace="~{fragments/info-box :: infoRows(${infoRows})}"></div>

  <p style="margin:16px 0 0 0;font-size:14px;color:#52525b;">
    <strong>Próximo passo:</strong> Conclua o pagamento com segurança pelo chat para liberar a produção da sua peça.
  </p>
</div>
</body>
</html>
